<li>
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "2 Jan 2006" }}</time>
  <span class="what"><a class="name" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Params.tags }}<span class="tags">{{ range $i, $t := first 4 . }}{{ if $i }}, {{ end }}{{ $t }}{{ end }}</span>{{ end }}</span>
</li>
