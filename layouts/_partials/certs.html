{{ with hugo.Data.certificaciones.certificaciones }}
<ul class="ledger">
  {{ range . }}
  <li>
    <span class="name">{{ .nombre }}</span>
    <span class="what">{{ .emisor }}{{ with .verificacion }}, <a href="{{ . }}" rel="noopener">verificar credencial</a>{{ end }}</span>
    <span class="status{{ if eq .estado "Obtenida" }} done{{ end }}">{{ .estado }}{{ with .fecha }}, {{ . }}{{ end }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
