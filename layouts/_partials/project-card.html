<a class="card" href="{{ .RelPermalink }}">
  <span class="state{{ if eq .Params.estado "Terminado" }} done{{ end }}">{{ .Params.estado | default "En progreso" }}</span>
  <strong>{{ .Title }}</strong>
  <span class="muted">{{ .Params.summary | default .Summary | plainify | truncate 150 }}</span>
  {{ with .Params.stack }}<span class="stack">{{ range first 6 . }}<span>{{ . }}</span>{{ end }}</span>{{ end }}
</a>
